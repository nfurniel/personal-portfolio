<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Portfolio de Nicolás Furnieles — Full Stack Developer y estudiante de DAWE. Experiencias web modernas con React, Three.js y shaders." />
    <meta name="color-scheme" content="light dark" />
    <!-- Resolve the theme before first paint. Without this the document renders
         with the default light tokens for a frame, so dark-theme visitors get a
         white flash and the preloader opens in the wrong palette. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('theme')
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
          var root = document.documentElement
          root.setAttribute('data-theme', theme)
          if (theme === 'dark') root.classList.add('dark')
          root.style.colorScheme = theme
        } catch (e) {}
      })()
    </script>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23141414'/%3E%3Ctext x='50' y='66' font-family='Inter,sans-serif' font-size='56' font-weight='800' text-anchor='middle' fill='%23FF9FFC'%3EN%3C/text%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Preload the Geist font CSS so it starts downloading immediately with the HTML,
         in parallel with the JS bundle. Avoids the FOUT layout jump when the preloader
         text rerenders from system font to Geist mid-animation. -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&family=Geist+Mono:wght@100..900&family=Fraunces:opsz,wght@9..144,300..900&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&family=Geist+Mono:wght@100..900&family=Fraunces:opsz,wght@9..144,300..900&display=swap"
    />
    <title>Nicolás Furnieles · Full Stack Developer</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
